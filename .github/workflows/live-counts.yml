name: live-counts
# Renames the Discord GAMES category + game channels with the live Roblox player counts, every 10 minutes.
# GitHub's cron is best effort (it ran only every 4-7 h), so each run loops for ~5.5 h and then dispatches the next run itself.
# The schedule is only a backup that restarts the chain if it ever breaks. Bot token = repo secret DISCORD_BOT_TOKEN.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: write
concurrency:
  group: live-counts
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u live_counts.py --loop --minutes 330
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PYTHONIOENCODING: utf-8
      - name: Start the next run
        if: ${{ !cancelled() }}
        run: gh workflow run live-counts.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
