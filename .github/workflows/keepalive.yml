name: keepalive
# GitHub pauses scheduled workflows in repos with no activity for 60 days: an empty commit once a month keeps live-counts on.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
